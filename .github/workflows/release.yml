name: Release

run-name: Release ${{ github.run_number }}

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build Installer And Publish Release
    runs-on: windows-latest

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      RELEASE_VERSION: ${{ github.run_number }}
      RELEASE_TAG: v${{ github.run_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build .\HsWin.slnx --configuration Release

      - name: Test
        run: dotnet test .\HsWin.slnx --configuration Release --no-build

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        id: installer
        shell: pwsh
        run: |
          .\scripts\Build-Installer.ps1 -Configuration Release -Version $env:RELEASE_VERSION
          $installerPath = Resolve-Path ".\artifacts\installer\hswin-x64-setup.exe"
          $installerName = Split-Path -Leaf $installerPath.Path
          "path=$($installerPath.Path)" >> $env:GITHUB_OUTPUT
          "name=$installerName" >> $env:GITHUB_OUTPUT

      - name: Build WinGet manifests
        id: winget
        shell: pwsh
        run: |
          $installerUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:RELEASE_TAG/${{ steps.installer.outputs.name }}"
          $manifestPath = .\scripts\Build-WinGetManifests.ps1 `
            -Version $env:RELEASE_VERSION `
            -InstallerPath "${{ steps.installer.outputs.path }}" `
            -InstallerUrl $installerUrl
          $archivePath = Join-Path (Resolve-Path ".\artifacts").Path "winget-manifests-$env:RELEASE_TAG.zip"
          Compress-Archive -LiteralPath (Resolve-Path ".\artifacts\winget\manifests").Path `
            -DestinationPath $archivePath `
            -Force
          "path=$manifestPath" >> $env:GITHUB_OUTPUT
          "archive=$archivePath" >> $env:GITHUB_OUTPUT
          "archiveName=$(Split-Path -Leaf $archivePath)" >> $env:GITHUB_OUTPUT

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.installer.outputs.name }}
          path: ${{ steps.installer.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload WinGet manifest artifact
        uses: actions/upload-artifact@v7
        with:
          name: winget-manifests-${{ env.RELEASE_TAG }}
          path: ${{ steps.winget.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @"
          Automated normal release from GitHub Actions run $env:GITHUB_RUN_NUMBER.

          Commit: $env:GITHUB_SHA
          Installer: ${{ steps.installer.outputs.name }}
          WinGet manifests: ${{ steps.winget.outputs.archiveName }}
          Code signing policy: https://github.com/$env:GITHUB_REPOSITORY#code-signing-policy
          "@

          gh release create $env:RELEASE_TAG `
            "${{ steps.installer.outputs.path }}" `
            "${{ steps.winget.outputs.archive }}" `
            --title "Hammerspoon (Windows Edition) v$env:RELEASE_VERSION" `
            --notes $notes `
            --target $env:GITHUB_SHA `
            --latest
